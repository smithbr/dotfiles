# Teams for st. One table per team:
#
#   [team-name]
#   dir     = "~/some/dir"         where every agent starts (default: current dir)
#   command = "claude"             what each tab runs (default: claude)
#   args    = ["--model", "opus"]  extra arguments before the prompt (optional)
#
#   [[team-name.agents]]           one per tab, in order
#   name   = "tab-title"           required
#   prompt = "/role do the thing"  first message (optional: blank starts idle)
#   dir, command, args             override the team's for this agent (optional)
#
# st TEAM opens every agent; st AGENT opens just that one, with its team's
# settings (st TEAM/AGENT when two teams share the agent name).
#
# Try a change with: st <team> --dry-run

[blife]
dir = "~/Obsidian/blife"

[[blife.agents]]
name = "daily-briefer"
prompt = "/daily-briefer what now?"

[[blife.agents]]
name = "task-sorter"
prompt = "/task-sorter sort the inbox"

[blife-intake]
dir = "~/Obsidian/blife"

[[blife-intake.agents]]
name = "intake"
prompt = "Run intake"

[dotfiles]
dir = "~/.dotfiles"

[[dotfiles.agents]]
name = "dotfiles"
