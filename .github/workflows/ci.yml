name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bats (${{ matrix.shard }})
    # macOS runner: a few tests are macOS-only, and this is the OS the suite is
    # written against. The runner image ships bash 3.2 and neither shellcheck
    # nor stow, like a fresh Mac.
    runs-on: macos-latest
    # Five shards of about equal time on CI's runners, the most macOS jobs an
    # account runs at once. The last globs every file not named in NAMED, so a
    # new .bats file runs there without a change here, and lints first with the
    # same Homebrew shellcheck a Mac has.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: link
            files: tests/link.bats
          - shard: doctor-install
            files: tests/doctor.bats tests/install.bats tests/bootstrap.bats
          - shard: bin
            files: tests/bin_scripts.bats tests/bin_pihole.bats tests/bin_firetv.bats
          - shard: helpers
            files: tests/common.bats tests/bin_ph_backup.bats tests/brew.bats tests/ai_doctor.bats tests/ph.bats
          - shard: lint-others
            files: ''
            lint: true
    # The bats suite shells out to TUI tools (tput/stty); give it a sane TERM so
    # terminal-aware scripts behave as they do in an interactive shell.
    env:
      TERM: xterm
      NAMED: >-
        tests/link.bats tests/doctor.bats tests/install.bats tests/bootstrap.bats
        tests/bin_scripts.bats tests/bin_pihole.bats tests/bin_firetv.bats
        tests/common.bats tests/bin_ph_backup.bats tests/brew.bats
        tests/ai_doctor.bats tests/ph.bats
      FILES: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suite's own tools (tests/deps.sh): Bats, GNU parallel, uv's Python,
      # and a bash built from source, which takes minutes on a cold cache and
      # is restored on every run after a pin change. No restore-keys: a partial
      # restore would keep old versions around.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/dotfiles/tests
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/deps.sh') }}
      # The machine's own tools, which run_tests.sh requires but never installs.
      - name: Install stow and uv
        run: brew install stow uv ${{ matrix.lint && 'shellcheck' || '' }}
      - name: Run shellcheck
        if: matrix.lint
        run: bash tests/run_tests.sh --lint-only
      - name: Fetch test dependencies
        run: bash tests/deps.sh
      - name: Run bats shard
        shell: bash
        run: |
          read -r -a files <<< "${FILES}"
          if [[ "${#files[@]}" -eq 0 ]]; then
              for file in tests/*.bats; do
                  [[ " ${NAMED} " == *" ${file} "* ]] || files+=("${file}")
              done
          fi
          printf 'Files: %s\n' "${files[*]}"
          bash tests/run_tests.sh --no-lint "${files[@]}"
